[mcu Toolhead1]
canbus_uuid: 8c616e037ce6 # this is the EBB36 and not the sb2209
canbus_interface: can0


[adxl345 T1]
cs_pin: Toolhead1: PB12
spi_software_sclk_pin: Toolhead1: PB10
spi_software_mosi_pin: Toolhead1: PB11
spi_software_miso_pin: Toolhead1: PB2
axes_map: x,y,z

[extruder1]
step_pin: Toolhead1: PD0
dir_pin: Toolhead1: PD1
enable_pin: !Toolhead1: PD2
rotation_distance: 18.39716513232   #Clone bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: Toolhead1: PB13

#Measured on Sunlu PLA+
pressure_advance: 0.0400

max_extrude_only_distance: 150.0

control: pid
#Original values
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
#Values tuned with `PID_CALIBRATE HEATER=extruder TARGET=280`:  pid_Kp=12.357 pid_Ki=0.453 pid_Kd=84.334
pid_kp:12.357
pid_ki: 0.6 #0.453 Higher Ki makes it behave better because of the laggy response
pid_kd: 84.334

min_temp: -200 #TODO fix this once wired up
max_temp: 350



min_temp: 0
max_temp: 300

sensor_type: MAX31865
sensor_pin: Toolhead1:PA4
spi_software_sclk_pin: Toolhead1:PA5
spi_software_mosi_pin: Toolhead1:PA7
spi_software_miso_pin: Toolhead1:PA6
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

[tmc2209 extruder1]
uart_pin: Toolhead1: PA15
run_current: 0.650
stealthchop_threshold: 999999


#####################################################################
#   Filament runout sensors
#####################################################################

[filament_switch_sensor T1_filament_runout_1]
switch_pin: ^!Toolhead1:PB8 
pause_on_runout: true
insert_gcode:
  #STATUS_LOADING T=2
  #FORCE_MOVE STEPPER=extruder2 DISTANCE=30 VELOCITY=5
  #STATUS_READY T=2
runout_gcode:
    M117 T2 filament runout detected!  
event_delay: 3.0
pause_delay: 0.5

# this sensor is mostly to figure out if the filament is past the extruder or not
#[filament_switch_sensor T2_filament_runout_2]
#switch_pin: ^!Toolhead2:PB9
#pause_on_runout: False


#####################################################################
# 	Fans
#####################################################################

[fan_generic T1_partfan]
pin: Toolhead1: PA1

[heater_fan T1_hotend_fan]
pin: Toolhead1: PA0
heater: extruder1
heater_temp: 50.0
